<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORGEBORN — SFX Round 4</title>
<style>
  :root { --gold:#e8c878; --gold-dim:#c9b778; --ink:#f5efe4; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    background: radial-gradient(ellipse 90% 50% at 50% 0%, rgba(255,140,50,.10), transparent 60%), #0a0908;
    color:var(--ink); font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    padding: calc(18px + env(safe-area-inset-top)) 12px calc(200px + env(safe-area-inset-bottom));
    max-width:700px; margin:0 auto;
  }
  h1 { font-size:15px; font-weight:900; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); text-align:center; }
  .sub { text-align:center; font-size:11.5px; color:#a89a82; margin:7px 0 6px; line-height:1.55; }
  .sub b { color:var(--gold-dim); }
  .done { text-align:center; font-size:10.5px; color:#7d9a7d; margin-bottom:18px; }
  .cue { padding:13px 13px; margin-bottom:12px; border-radius:13px;
         border:1px solid rgba(255,200,120,.3);
         background:linear-gradient(180deg,rgba(42,32,20,.9),rgba(12,10,8,.95));
         box-shadow: inset 0 0 0 1px rgba(20,14,8,.85), inset 0 1px 0 rgba(255,220,160,.08); }
  .cue-head { margin-bottom:4px; }
  .id { font-size:14px; font-weight:800; letter-spacing:.05em; }
  .where { display:block; font-size:10.5px; color:#9a8f7d; margin-top:3px; line-height:1.4; }
  .note { font-size:10px; color:#8a7f6d; font-style:italic; margin:7px 0 10px; line-height:1.45; }
  .takes { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .take button {
    width:100%; min-height:66px; border-radius:11px; cursor:pointer; padding:8px 6px;
    border:1px solid rgba(255,200,120,.32); color:var(--ink);
    background:linear-gradient(180deg,rgba(50,38,24,.95),rgba(16,13,10,.96));
    box-shadow: inset 0 1px 0 rgba(255,220,160,.1);
    font-weight:800; letter-spacing:.05em; font-size:13px; line-height:1.25;
  }
  .take button small { display:block; font-size:9px; font-weight:700; color:#a2937a; letter-spacing:.03em; margin-top:4px; }
  .take button:active { transform:scale(.96); }
  .take.playing button { border-color:rgba(255,170,80,.8); box-shadow:0 0 14px rgba(255,140,40,.3); }
  .take.picked button {
    border-color:#5fbf7a; color:#bff0cf;
    background:linear-gradient(180deg,rgba(30,70,45,.95),rgba(10,26,16,.96));
    box-shadow:0 0 12px rgba(60,180,100,.28), inset 0 1px 0 rgba(180,240,200,.18);
  }
  .none { margin-top:8px; }
  .none button { width:100%; min-height:34px; border-radius:9px; cursor:pointer; font-size:10px; font-weight:800;
    letter-spacing:.1em; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:#8a8378; }
  .none.on button { border-color:#c0603f; background:rgba(180,70,40,.2); color:#ffab8a; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:11px 12px calc(11px + env(safe-area-inset-bottom));
         background:linear-gradient(180deg,rgba(10,9,8,.55),rgba(10,9,8,.98) 45%);
         border-top:1px solid rgba(255,200,120,.26); }
  .out { width:100%; height:70px; padding:9px 10px; border-radius:10px;
         border:1px solid rgba(255,200,120,.3); background:rgba(8,7,6,.92);
         color:var(--gold-dim); font-family:ui-monospace,Consolas,monospace; font-size:11px; resize:none; }
  .copy { width:100%; margin-top:7px; min-height:42px; border-radius:10px; cursor:pointer;
          border:1px solid rgba(255,170,80,.5); color:#2a1104; font-weight:900; letter-spacing:.1em; font-size:12px;
          background:linear-gradient(180deg,#ff9a4a,#e0561a); }
</style>
</head>
<body>
<h1>Round 4 — Last Two</h1>
<p class="sub">
  These two missed twice, so I stopped describing the game event and named <b>real-world sounds</b><br>
  that make the right shape. Four takes each.
</p>
<p class="done">29 of 31 cues are locked. These are the last holdouts.</p>
<div id="list"></div>

<div class="bar">
  <textarea class="out" id="out" readonly>Nothing picked yet.</textarea>
  <button class="copy" id="copy">COPY RESULTS</button>
</div>

<script>
const CUES = [
  ['card_flip', 'a card turns face up in the pack ceremony — needs a sharp, dry snap',
   'Rounds 2-3 asked for "a card flipping" and got mush. These are objects that already make that exact transient.',
   {G:'book cover slammed shut', H:'close whip crack', I:'magician card flick', J:'coaster flicked flat'}],
  ['elem_lightning', 'lightning attack in battle — needs violence, not a buzz',
   'Rounds 2-3 asked for "a lightning spell" and got generic electricity. These are real high-voltage events.',
   {G:'thunder clap overhead', H:'transformer exploding', I:'tesla coil firing', J:'strike on a steel tower'}],
];
const picks = {};
let current = null;
const list = document.getElementById('list');

for (const [id, where, note, hints] of CUES) {
  const cue = document.createElement('div'); cue.className = 'cue';
  cue.innerHTML = '<div class="cue-head"><span class="id">'+id+'</span><span class="where">'+where+'</span></div>'
                + '<p class="note">'+note+'</p>';
  const takes = document.createElement('div'); takes.className = 'takes';
  for (const L of Object.keys(hints)) {
    const wrap = document.createElement('div'); wrap.className = 'take'; wrap.dataset.cue = id; wrap.dataset.take = L;
    const b = document.createElement('button');
    b.innerHTML = L + '<small>' + hints[L] + '</small>';
    const audio = new Audio('assets/audio/sfx/variants/' + id + '-' + L + '.mp3');
    audio.preload = 'none';
    b.addEventListener('click', () => {
      if (picks[id] === L) { picks[id] = null; sync(); return; }
      if (current && current !== audio) { current.pause(); current.currentTime = 0; }
      document.querySelectorAll('.take.playing').forEach((t)=>t.classList.remove('playing'));
      current = audio; audio.currentTime = 0; audio.play().catch(()=>{});
      wrap.classList.add('playing');
      picks[id] = L; sync();
    });
    audio.addEventListener('ended', () => wrap.classList.remove('playing'));
    wrap.appendChild(b); takes.appendChild(wrap);
  }
  cue.appendChild(takes);
  const none = document.createElement('div'); none.className = 'none'; none.dataset.cue = id;
  const nb = document.createElement('button'); nb.textContent = 'STILL NOT RIGHT';
  nb.addEventListener('click', () => { picks[id] = picks[id]==='none'?null:'none'; sync(); });
  none.appendChild(nb); cue.appendChild(none);
  list.appendChild(cue);
}

function sync() {
  document.querySelectorAll('.take').forEach((t)=>{
    t.classList.toggle('picked', picks[t.dataset.cue] === t.dataset.take);
  });
  document.querySelectorAll('.none').forEach((n)=>{
    n.classList.toggle('on', picks[n.dataset.cue] === 'none');
  });
  const lines = [];
  for (const k of Object.keys(picks)) if (picks[k]) lines.push(k + ': ' + picks[k]);
  document.getElementById('out').value = lines.length ? lines.join('\n') : 'Nothing picked yet.';
}
document.getElementById('copy').addEventListener('click', async () => {
  const t = document.getElementById('out');
  try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); }
  const b = document.getElementById('copy'); const o = b.textContent;
  b.textContent = 'COPIED'; setTimeout(()=>{ b.textContent = o; }, 1200);
});
sync();
</script>
</body>
</html>
