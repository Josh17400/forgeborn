<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORGEBORN — Combat Audition Round 2</title>
<style>
  :root { --gold:#e8c878; --gold-dim:#c9b778; --ink:#f5efe4; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    background: radial-gradient(ellipse 90% 50% at 50% 0%, rgba(120,160,255,.10), transparent 60%), #0a0908;
    color:var(--ink); font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    padding: calc(18px + env(safe-area-inset-top)) 12px calc(190px + env(safe-area-inset-bottom));
    max-width:720px; margin:0 auto;
  }
  h1 { font-size:15px; font-weight:900; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); text-align:center; }
  .sub { text-align:center; font-size:11.5px; color:#a89a82; margin:8px 0 14px; line-height:1.6; }
  .sub b { color:var(--gold-dim); }
  h2 { display:flex; align-items:center; gap:10px; font-size:10px; font-weight:800; letter-spacing:.24em;
       text-transform:uppercase; color:var(--gold-dim); margin:22px 0 4px; }
  h2::before,h2::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(214,178,110,.4)); }
  h2::after { background:linear-gradient(90deg,rgba(214,178,110,.4),transparent); }
  .desc { font-size:10.5px; color:#8a7f6d; text-align:center; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:6px; }
  .cand { display:flex; flex-direction:column; border:1px solid rgba(255,200,120,.3); border-radius:10px; overflow:hidden;
          background:linear-gradient(180deg,rgba(50,38,24,.95),rgba(16,13,10,.96)); }
  .cand button { border:0; cursor:pointer; background:transparent; color:var(--ink); font-weight:900; }
  .cand .play { min-height:44px; font-size:12px; border-bottom:1px solid rgba(255,200,120,.2); }
  .cand .play.playing { color:#ffb066; text-shadow:0 0 8px rgba(255,140,40,.6); }
  .cand .like { min-height:34px; font-size:14px; color:#6b5f4d; }
  .cand.liked { border-color:#5fbf7a; box-shadow:0 0 9px rgba(60,180,100,.25); }
  .cand.liked .like { color:#7fe09a; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
         background:linear-gradient(180deg,rgba(10,9,8,.55),rgba(10,9,8,.98) 45%); border-top:1px solid rgba(255,200,120,.26); }
  .prog { font-size:10px; color:#a2937a; text-align:center; margin-bottom:6px; letter-spacing:.06em; }
  .out { width:100%; height:52px; padding:8px 10px; border-radius:10px; border:1px solid rgba(255,200,120,.3);
         background:rgba(8,7,6,.92); color:var(--gold-dim); font-family:ui-monospace,Consolas,monospace; font-size:10px; resize:none; }
  .copy { width:100%; margin-top:6px; min-height:42px; border-radius:10px; cursor:pointer;
          border:1px solid rgba(255,170,80,.5); color:#2a1104; font-weight:900; letter-spacing:.1em; font-size:12px;
          background:linear-gradient(180deg,#ff9a4a,#e0561a); }
</style>
</head>
<body>
<h1>Combat Audition — Round 2</h1>
<p class="sub">Charged + crit rebuilt to your spec.<br>
<b>Charged</b>: energy charging up, building and building, then a deep bass BOOM with crackle.<br>
<b>Crit</b>: crisp deep-cutting slash piercing armour, then crackle or armour crush.<br>
♥ every take you want in the game, then COPY RESULT.</p>

<div id="sections"></div>

<div class="bar">
  <div class="prog" id="prog"></div>
  <textarea class="out" id="out" readonly></textarea>
  <button class="copy" id="copy">COPY RESULT</button>
</div>

<script>
const GROUPS = [
  ['ca2', 'Charged attacks', 'build-up → deep bass boom with crackle', 15],
  ['crit2', 'Critical strikes', 'piercing slash → crackle / armour crush', 10],
];
let current = null;
const likes = JSON.parse(localStorage.getItem('sfxCombatLikes2') || '{}');

function play(src, btn) {
  if (current) { current.pause(); current.currentTime = 0; }
  document.querySelectorAll('.play.playing').forEach((x)=>x.classList.remove('playing'));
  const a = new Audio(src);
  current = a; a.play().catch(()=>{});
  if (btn) { btn.classList.add('playing'); a.addEventListener('ended', ()=>btn.classList.remove('playing')); }
}

const root = document.getElementById('sections');
for (const [id, title, desc, n] of GROUPS) {
  const h = document.createElement('h2'); h.textContent = title; root.appendChild(h);
  const d = document.createElement('div'); d.className = 'desc'; d.textContent = desc; root.appendChild(d);
  const grid = document.createElement('div'); grid.className = 'grid';
  for (let i = 1; i <= n; i++) {
    const el = document.createElement('div'); el.className = 'cand';
    if ((likes[id]||[]).includes(i)) el.classList.add('liked');
    const p = document.createElement('button'); p.className = 'play'; p.textContent = i;
    p.addEventListener('click', ()=>play('assets/audio/sfx/variants/' + id + '-v' + i + '.mp3?v=c83b', p));
    const l = document.createElement('button'); l.className = 'like'; l.textContent = '♥';
    l.addEventListener('click', ()=>{
      const arr = likes[id] || [];
      const at = arr.indexOf(i);
      if (at >= 0) arr.splice(at, 1); else arr.push(i);
      if (arr.length) likes[id] = arr; else delete likes[id];
      localStorage.setItem('sfxCombatLikes2', JSON.stringify(likes));
      el.classList.toggle('liked', at < 0);
      sync();
    });
    el.appendChild(p); el.appendChild(l);
    grid.appendChild(el);
  }
  root.appendChild(grid);
}

function sync() {
  const names = { ca2:'charged', crit2:'crit' };
  const lines = [];
  for (const [id, arr] of Object.entries(likes)) {
    lines.push((names[id]||id) + ': ' + arr.slice().sort((a,b)=>a-b).join(','));
  }
  document.getElementById('out').value = lines.length ? 'COMBAT KEEPS 2\n' + lines.sort().join('\n') : 'No keeps yet.';
  const total = Object.values(likes).reduce((s,a)=>s+a.length,0);
  document.getElementById('prog').textContent = total + ' takes approved';
}
document.getElementById('copy').addEventListener('click', async () => {
  const t = document.getElementById('out');
  try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); }
  const b = document.getElementById('copy'); const o = b.textContent;
  b.textContent = 'COPIED'; setTimeout(()=>{ b.textContent = o; }, 1200);
});
sync();
</script>
</body>
</html>
