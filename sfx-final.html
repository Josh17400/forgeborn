<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORGEBORN — SFX Final</title>
<style>
  :root { --gold:#e8c878; --gold-dim:#c9b778; --ink:#f5efe4; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    background: radial-gradient(ellipse 90% 50% at 50% 0%, rgba(255,140,50,.10), transparent 60%), #0a0908;
    color:var(--ink); font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    padding: calc(18px + env(safe-area-inset-top)) 12px calc(170px + env(safe-area-inset-bottom));
    max-width:700px; margin:0 auto;
  }
  h1 { font-size:15px; font-weight:900; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); text-align:center; }
  .sub { text-align:center; font-size:11.5px; color:#a89a82; margin:7px 0 16px; line-height:1.6; }
  .sub b { color:var(--gold-dim); }
  h2 { display:flex; align-items:center; gap:10px; font-size:10px; font-weight:800; letter-spacing:.24em;
       text-transform:uppercase; color:var(--gold-dim); margin:24px 0 11px; }
  h2::before,h2::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(214,178,110,.4)); }
  h2::after { background:linear-gradient(90deg,rgba(214,178,110,.4),transparent); }
  .ladder-btn {
    width:100%; min-height:52px; border-radius:12px; cursor:pointer; margin-bottom:12px;
    border:1px solid rgba(255,170,80,.55); color:#2a1104; font-weight:900; letter-spacing:.1em; font-size:12.5px;
    background:linear-gradient(180deg,#ff9a4a,#e0561a);
    box-shadow: inset 0 1px 0 rgba(255,240,200,.4), 0 3px 10px rgba(0,0,0,.45);
  }
  .ladder-btn:active { transform:scale(.98); }
  .ladder-btn.stop { background:linear-gradient(180deg,#8a8fa0,#4a5060); border-color:rgba(200,210,230,.5); color:#0e141e; }
  .rung { display:flex; align-items:center; gap:9px; padding:8px 10px; margin-bottom:5px; border-radius:10px;
          border:1px solid rgba(255,200,120,.2); background:rgba(24,19,13,.65); font-size:12px; }
  .rung.locked { opacity:.72; }
  .rung.active { border-color:rgba(255,170,80,.8); background:rgba(60,40,18,.8); }
  .rung .n { flex:0 0 22px; font-size:10px; font-weight:900; color:#8a7f6d; }
  .rung .nm { flex:1; font-weight:800; letter-spacing:.04em; }
  .rung .tag { font-size:9px; font-weight:800; letter-spacing:.1em; padding:3px 7px; border-radius:999px; }
  .rung .tag.ok { color:#8fe6b4; border:1px solid rgba(110,200,150,.4); }
  .rung .tag.new { color:#ffc98a; border:1px solid rgba(255,170,80,.5); }
  .rung button { flex:0 0 auto; width:38px; height:38px; border-radius:9px; cursor:pointer; font-size:13px;
    border:1px solid rgba(255,200,120,.3); background:linear-gradient(180deg,rgba(50,38,24,.95),rgba(16,13,10,.96)); color:var(--ink); }
  .cue { padding:12px; margin-bottom:10px; border-radius:12px; border:1px solid rgba(255,200,120,.3);
         background:linear-gradient(180deg,rgba(42,32,20,.9),rgba(12,10,8,.95)); }
  .cue-head { margin-bottom:9px; }
  .id { font-size:13.5px; font-weight:800; letter-spacing:.05em; }
  .where { display:block; font-size:10.5px; color:#9a8f7d; margin-top:3px; line-height:1.4; }
  .takes { display:grid; gap:7px; }
  .takes.c3 { grid-template-columns:repeat(3,1fr); }
  .takes.c2 { grid-template-columns:repeat(2,1fr); }
  .take button { width:100%; min-height:66px; border-radius:11px; cursor:pointer; padding:8px 6px;
    border:1px solid rgba(255,200,120,.32); color:var(--ink); text-align:center;
    background:linear-gradient(180deg,rgba(50,38,24,.95),rgba(16,13,10,.96));
    font-weight:800; letter-spacing:.04em; font-size:13px; line-height:1.25; }
  .take button small { display:block; font-size:9px; font-weight:600; color:#a2937a; margin-top:4px; line-height:1.4; }
  .take button:active { transform:scale(.96); }
  .take.playing button { border-color:rgba(255,170,80,.8); box-shadow:0 0 14px rgba(255,140,40,.3); }
  .take.picked button { border-color:#5fbf7a; color:#bff0cf;
    background:linear-gradient(180deg,rgba(30,70,45,.95),rgba(10,26,16,.96));
    box-shadow:0 0 12px rgba(60,180,100,.28); }
  .none { margin-top:7px; }
  .none button { width:100%; min-height:32px; border-radius:9px; cursor:pointer; font-size:9.5px; font-weight:800;
    letter-spacing:.1em; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:#8a8378; }
  .none.on button { border-color:#c0603f; background:rgba(180,70,40,.2); color:#ffab8a; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:11px 12px calc(11px + env(safe-area-inset-bottom));
         background:linear-gradient(180deg,rgba(10,9,8,.55),rgba(10,9,8,.98) 45%); border-top:1px solid rgba(255,200,120,.26); }
  .out { width:100%; height:62px; padding:9px 10px; border-radius:10px; border:1px solid rgba(255,200,120,.3);
         background:rgba(8,7,6,.92); color:var(--gold-dim); font-family:ui-monospace,Consolas,monospace; font-size:11px; resize:none; }
  .copy { width:100%; margin-top:7px; min-height:42px; border-radius:10px; cursor:pointer;
          border:1px solid rgba(255,170,80,.5); color:#2a1104; font-weight:900; letter-spacing:.1em; font-size:12px;
          background:linear-gradient(180deg,#ff9a4a,#e0561a); }
</style>
</head>
<body>
<h1>Final Round</h1>
<p class="sub">
  Uncommon is locked. Two left: <b>ultra rare</b> and <b>lightning</b>.<br>
  Lightning is now a sweep that travels across the stereo field, per your note.
</p>

<h2>The full rarity ladder</h2>
<button class="ladder-btn" id="ladder">PLAY ALL SEVEN IN ORDER</button>
<div id="rungs"></div>

<h2>Pick: ultra rare</h2>
<div id="newcues"></div>

<h2>Pick: lightning (layered by hand)</h2>
<div id="ltg"></div>

<div class="bar">
  <textarea class="out" id="out" readonly>Nothing picked yet.</textarea>
  <button class="copy" id="copy">COPY RESULTS</button>
</div>

<script>
const LADDER = [
  ['reveal_common','Common','ok',null],
  ['reveal_uncommon','Uncommon','ok',null],
  ['reveal_rare','Rare','ok',null],
  ['reveal_ultraRare','Ultra Rare','new','Z'],
  ['reveal_epic','Epic','ok',null],
  ['reveal_legendary','Legendary','ok',null],
  ['reveal_mythic','Mythic','ok',null],
];
const picks = {};
let current = null, ladderTimer = null, ladderIdx = -1;

function srcFor(id) {
  const rung = LADDER.find((r) => r[0] === id);
  if (rung && rung[2] === 'new') {
    const L = picks[id] && picks[id] !== 'none' ? picks[id] : rung[3];
    return 'assets/audio/sfx/variants/' + id + '-' + L + '.mp3';
  }
  return 'assets/audio/sfx/' + id + '.mp3';
}
function stopAll() {
  if (current) { current.pause(); current.currentTime = 0; current = null; }
  if (ladderTimer) { clearTimeout(ladderTimer); ladderTimer = null; }
  ladderIdx = -1;
  document.querySelectorAll('.rung.active').forEach((r)=>r.classList.remove('active'));
  document.querySelectorAll('.take.playing').forEach((t)=>t.classList.remove('playing'));
  document.getElementById('ladder').textContent = 'PLAY ALL SEVEN IN ORDER';
  document.getElementById('ladder').classList.remove('stop');
}

// ── ladder rows ──
const rungs = document.getElementById('rungs');
LADDER.forEach(([id, label, state], i) => {
  const row = document.createElement('div');
  row.className = 'rung ' + (state === 'ok' ? 'locked' : '');
  row.dataset.id = id;
  const b = document.createElement('button'); b.textContent = '▶';
  b.addEventListener('click', () => { stopAll(); playOne(id, row); });
  row.innerHTML = '<span class="n">' + (i+1) + '</span><span class="nm">' + label + '</span>'
    + '<span class="tag ' + (state==='ok'?'ok':'new') + '">' + (state==='ok'?'LOCKED':'CHOOSE') + '</span>';
  row.appendChild(b);
  rungs.appendChild(row);
});

function playOne(id, row) {
  const a = new Audio(srcFor(id));
  current = a; a.play().catch(()=>{});
  if (row) { row.classList.add('active'); a.addEventListener('ended', ()=>row.classList.remove('active')); }
  return a;
}

document.getElementById('ladder').addEventListener('click', () => {
  const btn = document.getElementById('ladder');
  if (ladderTimer || ladderIdx >= 0) { stopAll(); return; }
  btn.textContent = 'STOP'; btn.classList.add('stop');
  ladderIdx = 0;
  const step = () => {
    if (ladderIdx >= LADDER.length) { stopAll(); return; }
    document.querySelectorAll('.rung.active').forEach((r)=>r.classList.remove('active'));
    const [id] = LADDER[ladderIdx];
    const row = document.querySelector('.rung[data-id="' + id + '"]');
    const a = playOne(id, row);
    ladderIdx++;
    const advance = () => { ladderTimer = setTimeout(step, 260); };
    a.addEventListener('ended', advance);
    // Safety: if metadata never loads, do not stall the sequence.
    ladderTimer = setTimeout(() => { if (ladderIdx < LADDER.length) step(); }, 4200);
  };
  step();
});

// ── the two new reveal cues ──
const NEW_CUES = [
    ['reveal_ultraRare','sits between rare and epic — round 2, all-new characters',
    {W:'energy surge',X:'deep + weighty',Y:'forged anvil + arcane',Z:'riser into hit'}],
];
const nc = document.getElementById('newcues');
for (const [id, where, hints] of NEW_CUES) {
  nc.appendChild(buildCue(id, where, hints, 'c3'));
}

// ── lightning ──
const LTG = {
  S:'fast sweep L to R', T:'slow sweep + static bed',
  U:'sweep + thunder rolling away', V:'rapid branching, 5 steps',
};
document.getElementById('ltg').appendChild(
  buildCue('elem_lightning', 'crackling arc SPRAWLING across the card, panned left to right', LTG, 'c2'),
);

function buildCue(id, where, hints, cols) {
  const cue = document.createElement('div'); cue.className = 'cue';
  cue.innerHTML = '<div class="cue-head"><span class="id">'+id+'</span><span class="where">'+where+'</span></div>';
  const takes = document.createElement('div'); takes.className = 'takes ' + cols;
  for (const L of Object.keys(hints)) {
    const wrap = document.createElement('div'); wrap.className='take'; wrap.dataset.cue=id; wrap.dataset.take=L;
    const b = document.createElement('button');
    b.innerHTML = L + '<small>' + hints[L] + '</small>';
    b.addEventListener('click', () => {
      if (picks[id] === L) { picks[id] = null; sync(); return; }
      stopAll();
      const a = new Audio('assets/audio/sfx/variants/' + id + '-' + L + '.mp3');
      current = a; a.play().catch(()=>{});
      wrap.classList.add('playing');
      a.addEventListener('ended', ()=>wrap.classList.remove('playing'));
      picks[id] = L; sync();
    });
    wrap.appendChild(b); takes.appendChild(wrap);
  }
  cue.appendChild(takes);
  const none = document.createElement('div'); none.className='none'; none.dataset.cue=id;
  const nb = document.createElement('button'); nb.textContent='NONE WORK';
  nb.addEventListener('click', ()=>{ picks[id] = picks[id]==='none'?null:'none'; sync(); });
  none.appendChild(nb); cue.appendChild(none);
  return cue;
}

function sync() {
  document.querySelectorAll('.take').forEach((t)=>{
    t.classList.toggle('picked', picks[t.dataset.cue] === t.dataset.take);
  });
  document.querySelectorAll('.none').forEach((n)=>{
    n.classList.toggle('on', picks[n.dataset.cue] === 'none');
  });
  const lines = [];
  for (const k of Object.keys(picks)) if (picks[k]) lines.push(k + ': ' + picks[k]);
  document.getElementById('out').value = lines.length ? lines.join('\n') : 'Nothing picked yet.';
}
document.getElementById('copy').addEventListener('click', async () => {
  const t = document.getElementById('out');
  try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); }
  const b = document.getElementById('copy'); const o = b.textContent;
  b.textContent='COPIED'; setTimeout(()=>{ b.textContent=o; },1200);
});
sync();
</script>
</body>
</html>
